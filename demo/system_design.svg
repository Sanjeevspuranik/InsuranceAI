<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1040" role="img" aria-labelledby="title description">
  <title id="title">InsuranceAI application architecture</title>
  <desc id="description">Authenticated Next.js frontend, FastAPI API, database-backed worker, configurable database and object storage, YOLO damage detection, GPT-6-Luna report generation, and claim artifacts.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#315579"/>
    </marker>
    <marker id="arrow-muted" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#718096"/>
    </marker>
    <style>
      .title { font: 700 32px Arial, sans-serif; fill: #16324f; }
      .subtitle { font: 16px Arial, sans-serif; fill: #526579; }
      .section { font: 700 17px Arial, sans-serif; fill: #315579; letter-spacing: 1px; }
      .card-title { font: 700 19px Arial, sans-serif; fill: #16324f; }
      .body { font: 15px Arial, sans-serif; fill: #334155; }
      .small { font: 13px Arial, sans-serif; fill: #526579; }
      .card { stroke: #9fb2c5; stroke-width: 1.5; rx: 12; }
      .flow { fill: none; stroke: #315579; stroke-width: 2.5; marker-end: url(#arrow); }
      .optional { fill: none; stroke: #718096; stroke-width: 2; stroke-dasharray: 8 7; marker-end: url(#arrow-muted); }
    </style>
  </defs>

  <rect width="1500" height="1040" fill="#f7f9fc"/>
  <text x="54" y="58" class="title">InsuranceAI | Claim assessment architecture</text>
  <text x="54" y="87" class="subtitle">Authenticated web app • asynchronous image analysis • replaceable database and object storage</text>

  <text x="54" y="131" class="section">CLIENT &amp; IDENTITY</text>
  <rect x="50" y="151" width="270" height="160" class="card" fill="#e9f2fb"/>
  <text x="76" y="187" class="card-title">User / Browser</text>
  <text x="76" y="220" class="body">
    <tspan x="76" dy="0">Sign in and upload image</tspan>
    <tspan x="76" dy="23">Track claim status</tspan>
    <tspan x="76" dy="23">View report and files</tspan>
  </text>

  <rect x="395" y="151" width="370" height="160" class="card" fill="#e9f2fb"/>
  <text x="421" y="187" class="card-title">Next.js Frontend</text>
  <text x="421" y="220" class="body">
    <tspan x="421" dy="0">NextAuth session</tspan>
    <tspan x="421" dy="23">Upload and check claim status</tspan>
    <tspan x="421" dy="23">View report and download files</tspan>
  </text>

  <rect x="1035" y="151" width="410" height="160" class="card" fill="#f0effb"/>
  <text x="1061" y="187" class="card-title">Identity</text>
  <text x="1061" y="220" class="body">
    <tspan x="1061" dy="0">Development: shared token</tspan>
    <tspan x="1061" dy="23">Production: OIDC (e.g. Keycloak)</tspan>
    <tspan x="1061" dy="23">API validates signed access token</tspan>
  </text>

  <path d="M320 231 H395" class="flow"/>
  <path d="M765 185 H1035" class="optional"/>
  <text x="821" y="171" class="small">OIDC login (optional)</text>

  <text x="54" y="360" class="section">APPLICATION API &amp; PERSISTENCE</text>
  <rect x="395" y="382" width="370" height="220" class="card" fill="#e8f5ee"/>
  <text x="421" y="420" class="card-title">FastAPI</text>
  <text x="421" y="454" class="body">
    <tspan x="421" dy="0">Authenticate and check claim access</tspan>
    <tspan x="421" dy="23">Validate upload and queue claim</tspan>
    <tspan x="421" dy="23">Return status and report files</tspan>
  </text>

  <rect x="850" y="382" width="265" height="220" class="card" fill="#fff4df"/>
  <text x="876" y="420" class="card-title">Database</text>
  <text x="876" y="454" class="body">
    <tspan x="876" dy="0">SQLite / PostgreSQL</tspan>
    <tspan x="876" dy="23">Claims, ownership, status</tspan>
    <tspan x="876" dy="23">Report and artifact keys</tspan>
  </text>

  <rect x="1190" y="382" width="255" height="220" class="card" fill="#fff4df"/>
  <text x="1216" y="420" class="card-title">Object Storage</text>
  <text x="1216" y="454" class="body">
    <tspan x="1216" dy="0">Local files / S3-compatible</tspan>
    <tspan x="1216" dy="23">Original uploaded images</tspan>
    <tspan x="1216" dy="23">PDF + annotated images</tspan>
  </text>

  <path d="M580 311 V382" class="flow" marker-start="url(#arrow)"/>
  <text x="593" y="350" class="small">Bearer API</text>
  <path d="M765 465 H850" class="flow"/>
  <path d="M765 400 V365 H1175 V400 H1190" class="flow"/>

  <text x="54" y="665" class="section">BACKGROUND CLAIM WORKER</text>
  <rect x="50" y="686" width="1395" height="286" rx="16" fill="#eef2f7" stroke="#c2ceda" stroke-width="1.5"/>
  <text x="78" y="721" class="small">Separate process: polls queued claims, runs analysis, saves outputs, and updates status.</text>

  <rect x="78" y="755" width="235" height="160" class="card" fill="#ffffff"/>
  <text x="100" y="792" class="card-title">1. Claim job</text>
  <text x="100" y="826" class="body">
    <tspan x="100" dy="0">Queued -> processing</tspan>
    <tspan x="100" dy="23">Load original image</tspan>
  </text>

  <rect x="365" y="755" width="250" height="160" class="card" fill="#e8f5ee"/>
  <text x="387" y="792" class="card-title">2. YOLO model</text>
  <text x="387" y="826" class="body">
    <tspan x="387" dy="0">Damage types</tspan>
    <tspan x="387" dy="23">Confidence + locations</tspan>
  </text>

  <rect x="667" y="755" width="300" height="160" class="card" fill="#f0effb"/>
  <text x="689" y="792" class="card-title">3. GPT-6-Luna</text>
  <text x="689" y="826" class="body">
    <tspan x="689" dy="0">Image + detection data</tspan>
    <tspan x="689" dy="23">Report + assessment rationale</tspan>
    <tspan x="689" dy="23">Token count, when available</tspan>
  </text>

  <rect x="1018" y="755" width="330" height="160" class="card" fill="#e9f2fb"/>
  <text x="1040" y="792" class="card-title">4. Save results</text>
  <text x="1040" y="826" class="body">
    <tspan x="1040" dy="0">PDF + annotated image</tspan>
    <tspan x="1040" dy="23">Store artifacts</tspan>
    <tspan x="1040" dy="23">Complete claim or log failure</tspan>
  </text>

  <path d="M313 835 H365" class="flow"/>
  <path d="M615 835 H667" class="flow"/>
  <path d="M967 835 H1018" class="flow"/>

  <path d="M980 602 V645 H195 V755" class="flow"/>
  <text x="414" y="638" class="small">Queued jobs / status updates</text>
  <path d="M1305 602 V686" class="flow" marker-start="url(#arrow)"/>
  <text x="1320" y="649" class="small">Read / save files</text>

  <rect x="54" y="990" width="18" height="4" fill="#315579"/>
  <text x="80" y="997" class="small">Primary data/job flow</text>
  <rect x="245" y="990" width="18" height="4" fill="#718096"/>
  <text x="271" y="997" class="small">Optional identity path</text>
  <text x="1440" y="997" class="small" text-anchor="end">SQLite/file storage are local defaults; provider URLs are configurable.</text>
</svg>
